[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-x"
version = "0.1.0a0"
description = "Architecture-first cognitive harness for model-independent autonomous systems research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "lm-format-enforcer==0.11.3",
]
training = [
  "torch>=2.4,<3",
  "transformers>=4.55,<5",
  "datasets>=3,<5",
  "accelerate>=1,<2",
  "peft>=0.13,<1",
  "trl>=0.26,<0.27",
  "bitsandbytes>=0.45,<1",
  "lm-format-enforcer==0.11.3",
]
# Kept separate from the older pinned HF/PEFT stack above. Unsloth tracks newer
# Transformers/TRL combinations and should be installed as an operator-selected backend.
unsloth-training = [
  "unsloth>=2026.7",
  "lm-format-enforcer==0.11.3",
]
local-coding = [
  "torch>=2.4,<3",
  "transformers>=4.51,<6",
  "accelerate>=1,<2",
  "bitsandbytes>=0.45,<1",
  "lm-format-enforcer==0.11.3",
]
recurrent = [
  "torch>=2.4,<3",
  "transformers>=4.55,<5",
]

[project.scripts]
harness-x = "harness_x.cli:main"
harness-x-code = "harness_x.coding.cli:main"
harness-x-recurrent-depth = "harness_x.reasoning.recurrent_depth_cli:main"
harness-x-empirical-adapter = "harness_x.training.empirical_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_x"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
