name: m71-test-diagnostic

on:
  push:
    branches:
      - agent/diagnostic-m71-context-hang

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        nodeid:
          - tests/test_app_server_conversation_context.py::test_context_builder_is_deterministic_excludes_system_and_keeps_current_exactly_once
          - tests/test_app_server_conversation_context.py::test_context_builder_uses_recent_contiguous_suffix_under_item_and_size_bounds
          - tests/test_app_server_conversation_context.py::test_contextual_coordinator_freezes_prior_turns_into_second_app_session_and_restart
          - tests/test_app_server_conversation_context.py::test_pre_m71_plans_are_frozen_as_legacy_passthrough_instead_of_reinterpreted
          - tests/test_app_server_conversation_context.py::test_persisted_context_fails_closed_when_its_durable_chat_prefix_changes
          - tests/test_app_server_conversation_context.py::test_production_cli_keeps_m70_http_identity_but_installs_m71_context_coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run one M71 test verbosely
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=20s 180s pytest -vv -s "${{ matrix.nodeid }}"
