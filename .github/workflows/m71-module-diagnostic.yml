name: m71-module-diagnostic

on:
  push:
    branches:
      - agent/diagnostic-m71-context-hang

jobs:
  module:
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/test_app_server_conversation_context.py
          - tests/test_app_server_conversation_execution.py
          - tests/test_app_server_work_activity.py
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run one module verbosely
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=20s 240s pytest -vv -s "${{ matrix.test_file }}"
